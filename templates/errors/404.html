{% extends 'base.html' %}

{% block title %}Page Not Found | Lex Regis{% endblock %}

{% block content %}
<div class="d-flex align-items-center justify-content-center h-100 mt-5">
    <div class="text-center">
        <i class="fa-regular fa-compass text-warning" style="font-size: 5rem; opacity: 0.8;"></i>
        <h1 class="display-1 fw-bold text-primary mt-4">404</h1>
        <h3 class="fw-bold mb-3">Page Not Found</h3>
        <p class="text-muted mb-4">The page you are looking for has been moved or does not exist.</p>
        <a href="{% url 'dashboard:index' %}" class="btn btn-primary px-4 rounded-pill">
            <i class="fa-solid fa-arrow-left me-2"></i> Return to Dashboard
        </a>
    </div>
</div>
{% endblock %}
