<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title|default:"Sign In | Lex Regis" }}</title>
    
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
    
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    
    <!-- Custom Theme -->
    <link rel="stylesheet" href="/static/css/theme.css">
    <style>
        body {
            background-color: var(--color-primary);
            background-image: linear-gradient(135deg, var(--color-primary-dark) 0%, var(--color-primary) 100%);
        }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100 p-3">

    <div class="card card-premium shadow-lg border-0" style="width: 100%; max-width: 450px; overflow: hidden;">
        <!-- Top Accent -->
        <div style="height: 6px; background-color: var(--color-accent); width: 100%;"></div>
        
        <div class="card-body p-5">
            <div class="text-center mb-4">
                <a href="{% url 'public_site:home' %}" class="text-decoration-none d-inline-block">
                    <i class="fa-solid fa-scale-balanced fs-1 text-primary mb-3"></i>
                    <h3 class="fw-bold text-primary" style="font-family: var(--font-family-serif);">Lex Regis</h3>
                </a>
                <p class="text-muted small mt-2">Enterprise Legal Operations Platform</p>
            </div>
            
            {% if error %}
            <div class="alert alert-danger bg-danger bg-opacity-10 border-danger border-opacity-25 text-danger small py-2">
                <i class="fa-solid fa-circle-exclamation me-2"></i> {{ error }}
            </div>
            {% endif %}
            
            <form method="post" action="{% url 'accounts:login' %}">
                {% csrf_token %}
                <input type="hidden" name="next" value="{{ next|default:'' }}">
                
                <div class="mb-3">
                    <label class="form-label text-muted small fw-bold">Email Address</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0"><i class="fa-regular fa-envelope text-muted"></i></span>
                        <input type="email" name="username" class="form-control bg-light border-start-0 ps-0" placeholder="name@firm.com" required autofocus>
                    </div>
                </div>
                
                <div class="mb-4">
                    <div class="d-flex justify-content-between align-items-center mb-1">
                        <label class="form-label text-muted small fw-bold mb-0">Password</label>
                        <a href="#" class="small text-decoration-none text-primary">Forgot?</a>
                    </div>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0"><i class="fa-solid fa-lock text-muted"></i></span>
                        <input type="password" name="password" class="form-control bg-light border-start-0 ps-0" placeholder="••••••••" required>
                    </div>
                </div>
                
                <div class="form-check mb-4">
                    <input class="form-check-input" type="checkbox" id="rememberMe">
                    <label class="form-check-label text-muted small" for="rememberMe">
                        Keep me signed in
                    </label>
                </div>
                
                <button type="submit" class="btn btn-primary w-100 py-2 rounded-pill fw-bold">Sign In</button>
            </form>
        </div>
        <div class="card-footer bg-light border-top-0 text-center py-3">
            <small class="text-muted">Protected by Advanced Security Protocol</small>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
