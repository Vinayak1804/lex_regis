<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Lex Regis{% endblock %}</title>
    
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
    
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    
    <!-- Custom Theme -->
    <link rel="stylesheet" href="/static/css/theme.css">
    
    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    
    <!-- HTMX -->
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    
    {% csrf_token %}
</head>
<body x-data="themeToggle()" :class="{'dark-theme': theme === 'dark'}" class="bg-light lex-regis-app">

    <div class="d-flex" x-data="sidebar()">
        <!-- Sidebar -->
        {% include 'components/sidebar.html' %}
        
        <!-- Main Content Wrapper -->
        <div class="flex-grow-1 d-flex flex-column" style="min-height: 100vh; overflow-x: hidden;">
            
            <!-- Navbar -->
            {% include 'components/navbar.html' %}
            
            <!-- Page Content -->
            <main class="flex-grow-1 p-4">
                {% block content %}
                {% endblock %}
            </main>
            
            <!-- Footer -->
            {% include 'components/footer.html' %}
            
        </div>
    </div>
    
    <!-- Bootstrap Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/main.js"></script>
    
    {% include 'components/auth_modals.html' %}
    
    {% block scripts %}
    {% endblock %}
</body>
</html>
