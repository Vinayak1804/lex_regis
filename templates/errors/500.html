{% extends 'base.html' %}

{% block title %}Server Error | Lex Regis{% endblock %}

{% block content %}
<div class="d-flex align-items-center justify-content-center h-100 mt-5">
    <div class="text-center">
        <i class="fa-solid fa-triangle-exclamation text-danger" style="font-size: 5rem; opacity: 0.8;"></i>
        <h1 class="display-1 fw-bold text-primary mt-4">500</h1>
        <h3 class="fw-bold mb-3">Server Error</h3>
        <p class="text-muted mb-4">An unexpected error occurred on our end. Our team has been notified.</p>
        <a href="{% url 'dashboard:index' %}" class="btn btn-primary px-4 rounded-pill">
            <i class="fa-solid fa-arrow-left me-2"></i> Return to Dashboard
        </a>
    </div>
</div>
{% endblock %}
