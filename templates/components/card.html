<div class="card card-premium {% if class_names %}{{ class_names }}{% endif %}">
    {% if title or header_html %}
    <div class="card-header bg-transparent border-bottom-0 pt-4 pb-0 d-flex justify-content-between align-items-center">
        {% if title %}
        <h5 class="fw-bold text-primary mb-0">
            {% if icon %}<i class="fa-solid fa-{{ icon }} me-2 text-muted"></i>{% endif %}
            {{ title }}
        </h5>
        {% endif %}
        
        {% if header_actions %}
        <div class="card-actions">
            {{ header_actions|safe }}
        </div>
        {% endif %}
    </div>
    {% endif %}
    
    <div class="card-body">
        {{ body|safe }}
    </div>
</div>
