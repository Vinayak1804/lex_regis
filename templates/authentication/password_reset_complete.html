{% extends 'base_auth.html' %}

{% block title %}Password Updated | Lex Regis{% endblock %}

{% block content %}
<div class="auth-card">
    <div class="p-5 text-center">
        <a href="{% url 'public_site:home' %}" class="auth-logo mb-4">
            <i class="fa-solid fa-scale-balanced text-gold fs-1 mb-3"></i>
            <h3 class="fw-bold text-navy font-serif">Lex Regis</h3>
        </a>
        
        <div class="my-4">
            <div class="bg-light rounded-circle d-inline-flex align-items-center justify-content-center mb-4" style="width: 80px; height: 80px;">
                <i class="fa-solid fa-check text-success fs-1"></i>
            </div>
            <h4 class="fw-bold text-navy">Password Updated</h4>
            <p class="text-muted mt-3">
                Your password has been set. You may go ahead and log in now.
            </p>
        </div>
        
        <a href="{% url 'accounts:login' %}" class="btn btn-gold w-100 py-2 rounded-pill fw-bold fs-5 mt-2">Sign In</a>
    </div>
</div>
{% endblock %}
