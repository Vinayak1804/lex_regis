{% extends 'base.html' %}
{% load static %}

{% block title %}Enterprise Settings | Lex Regis{% endblock %}

{% block content %}
<div class="container-fluid p-0">
    <div class="d-flex justify-content-between align-items-center mb-4 pb-3 border-bottom">
        <div>
            <h3 class="mb-0 fw-bold font-serif text-navy">
                <i class="fa-solid fa-gear me-2 text-secondary"></i> System Settings
            </h3>
            <p class="text-muted small mb-0 mt-1">Manage enterprise configuration, security, and preferences.</p>
        </div>
        <button class="btn btn-navy btn-sm rounded-pill px-4 fw-bold hover-lift">Save Changes</button>
    </div>

    <div class="row g-4">
        <div class="col-md-3">
            <div class="card card-premium shadow-sm border-0 rounded-4">
                <div class="list-group list-group-flush rounded-4">
                    <a href="#" class="list-group-item list-group-item-action active fw-bold border-0"><i class="fa-solid fa-user me-2"></i> General</a>
                    <a href="#" class="list-group-item list-group-item-action fw-bold border-0 text-muted"><i class="fa-solid fa-shield-halved me-2"></i> Security</a>
                    <a href="#" class="list-group-item list-group-item-action fw-bold border-0 text-muted"><i class="fa-solid fa-building me-2"></i> Firm Details</a>
                    <a href="#" class="list-group-item list-group-item-action fw-bold border-0 text-muted"><i class="fa-solid fa-credit-card me-2"></i> Billing</a>
                    <a href="#" class="list-group-item list-group-item-action fw-bold border-0 text-muted"><i class="fa-solid fa-bell me-2"></i> Notifications</a>
                </div>
            </div>
        </div>
        <div class="col-md-9">
            <div class="card card-premium shadow-sm border-0 rounded-4 mb-4">
                <div class="card-header bg-white pt-4 pb-3 border-bottom">
                    <h5 class="fw-bold text-navy mb-0">General Configuration</h5>
                </div>
                <div class="card-body p-4">
                    <form>
                        <div class="row mb-3">
                            <label class="col-sm-3 col-form-label fw-bold text-muted">System Timezone</label>
                            <div class="col-sm-9">
                                <select class="form-select bg-light border-0">
                                    <option>Asia/Kolkata (IST)</option>
                                    <option>America/New_York (EST)</option>
                                </select>
                            </div>
                        </div>
                        <div class="row mb-3">
                            <label class="col-sm-3 col-form-label fw-bold text-muted">Date Format</label>
                            <div class="col-sm-9">
                                <select class="form-select bg-light border-0">
                                    <option>DD/MM/YYYY</option>
                                    <option>MM/DD/YYYY</option>
                                </select>
                            </div>
                        </div>
                        <div class="row mb-3">
                            <label class="col-sm-3 col-form-label fw-bold text-muted">Two-Factor Auth</label>
                            <div class="col-sm-9">
                                <div class="form-check form-switch mt-2">
                                    <input class="form-check-input" type="checkbox" checked>
                                    <label class="form-check-label fw-bold text-success">Enabled for Enterprise</label>
                                </div>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
