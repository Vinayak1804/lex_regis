{% extends 'base.html' %}

{% block title %}Cases | Lex Regis{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <div>
        <h2 class="fw-bold mb-1" style="color: var(--color-primary); font-family: var(--font-family-serif);">
            <i class="fa-solid fa-briefcase me-2 text-warning"></i> Cases
        </h2>
        <p class="text-muted mb-0 small">Manage and track all active legal matters.</p>
    </div>
    <div class="d-flex gap-2">
        <button class="btn btn-outline-secondary" type="button" data-bs-toggle="collapse" data-bs-target="#filterCollapse" aria-expanded="false" aria-controls="filterCollapse">
            <i class="fa-solid fa-filter me-2"></i> Filters
        </button>
        <a href="{% url 'cases_ui:create' %}" class="btn btn-accent"><i class="fa-solid fa-plus me-2"></i> New Case</a>
    </div>
</div>

<div class="mb-4">
    <ul class="nav nav-pills nav-fill bg-white shadow-sm rounded-pill p-1">
        <li class="nav-item">
            <a class="nav-link rounded-pill fw-bold {% if current_filter == 'ALL' %}active bg-lex-primary text-white{% else %}text-muted{% endif %}" 
               href="?source=ALL{% if search_query %}&q={{ search_query }}{% endif %}">
                All Records
            </a>
        </li>
        <li class="nav-item">
            <a class="nav-link rounded-pill fw-bold {% if current_filter == 'AI_INTAKE' %}active bg-lex-primary text-white{% else %}text-muted{% endif %}" 
               href="?source=AI_INTAKE{% if search_query %}&q={{ search_query }}{% endif %}">
                AI Legal Intake
            </a>
        </li>
        <li class="nav-item">
            <a class="nav-link rounded-pill fw-bold {% if current_filter == 'TALK_TO_LAWYER' %}active bg-lex-gold text-lex-navy-dark{% else %}text-muted{% endif %}" 
               href="?source=TALK_TO_LAWYER{% if search_query %}&q={{ search_query }}{% endif %}">
                Talk to a Lawyer
            </a>
        </li>
        <li class="nav-item">
            <a class="nav-link rounded-pill fw-bold {% if current_filter == 'MANUAL' %}active bg-lex-primary text-white{% else %}text-muted{% endif %}" 
               href="?source=MANUAL{% if search_query %}&q={{ search_query }}{% endif %}">
                Formal Cases
            </a>
        </li>
    </ul>
</div>

<div class="collapse mb-4" id="filterCollapse">
    <div class="card card-premium shadow-sm border-0">
        <div class="card-body">
            <form id="filterForm" class="row g-3" hx-get="{% url 'cases_ui:list' %}" hx-target="#case-cards-container" hx-trigger="change, keyup delay:500ms from:input[name='q']">
                <div class="col-md-12">
                    <div class="position-relative">
                        <i class="fa-solid fa-search position-absolute text-muted" style="top: 50%; transform: translateY(-50%); left: 12px;"></i>
                        <input type="text" class="form-control bg-light border-0 ps-5" placeholder="Search by Case Number, Title, or Client..." name="q" value="{{ search_query }}">
                    </div>
                </div>
                <div class="col-md-3">
                    <label class="form-label small fw-bold text-muted">Case Type</label>
                    <select name="type" class="form-select form-select-sm">
                        <option value="">All Types</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label class="form-label small fw-bold text-muted">Category</label>
                    <select name="category" class="form-select form-select-sm">
                        <option value="">All Categories</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label class="form-label small fw-bold text-muted">Status</label>
                    <select name="status" class="form-select form-select-sm">
                        <option value="">All Statuses</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label class="form-label small fw-bold text-muted">Priority</label>
                    <select name="priority" class="form-select form-select-sm">
                        <option value="">All Priorities</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label class="form-label small fw-bold text-muted">Court</label>
                    <select name="court" class="form-select form-select-sm">
                        <option value="">All Courts</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label class="form-label small fw-bold text-muted">Advocate</label>
                    <select name="advocate" class="form-select form-select-sm">
                        <option value="">All Advocates</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label class="form-label small fw-bold text-muted">Client</label>
                    <select name="client" class="form-select form-select-sm">
                        <option value="">All Clients</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label class="form-label small fw-bold text-muted">Date Range</label>
                    <input type="date" name="date_from" class="form-control form-control-sm">
                </div>
            </form>
        </div>
    </div>
</div>

<div class="row g-4" id="case-cards-container">
    {% include 'cases/partials/case_table.html' %}
</div>
{% endblock %}
