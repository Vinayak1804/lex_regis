{% for message in messages %}
    {% if message.sender == 'USER' %}
    <!-- User Message -->
    <div class="d-flex justify-content-end mb-4">
        <div class="bg-primary text-white p-3 rounded-4 shadow-sm" style="max-width: 75%; border-top-right-radius: 0 !important;">
            <p class="mb-0" style="font-size: 0.95rem;">{{ message.content }}</p>
        </div>
        <div class="bg-light rounded-circle d-flex align-items-center justify-content-center flex-shrink-0 ms-3 mt-1 border shadow-sm" style="width: 36px; height: 36px;">
            <i class="fa-solid fa-user text-muted small"></i>
        </div>
    </div>
    {% elif message.sender == 'AI' %}
    <!-- AI Message -->
    <div class="d-flex mb-4">
        <div class="bg-primary rounded-circle d-flex align-items-center justify-content-center flex-shrink-0 me-3 mt-1 shadow-sm" style="width: 36px; height: 36px;">
            <i class="fa-solid fa-scale-balanced text-white small"></i>
        </div>
        <div class="bg-white text-dark p-3 rounded-4 shadow-sm border" style="max-width: 75%; border-top-left-radius: 0 !important;">
            <p class="mb-0" style="font-size: 0.95rem; line-height: 1.6;">{{ message.content }}</p>
            
            <div class="d-flex justify-content-end mt-2 pt-2 border-top border-light gap-2">
                <button class="btn btn-sm btn-link text-muted p-0 text-decoration-none"><i class="fa-regular fa-copy"></i></button>
                <button class="btn btn-sm btn-link text-muted p-0 text-decoration-none"><i class="fa-regular fa-thumbs-up"></i></button>
                <button class="btn btn-sm btn-link text-muted p-0 text-decoration-none"><i class="fa-regular fa-thumbs-down"></i></button>
            </div>
        </div>
    </div>
    {% else %}
    <!-- System Message -->
    <div class="text-center mb-4">
        <span class="badge bg-light text-muted border px-3 py-2 fw-normal rounded-pill">{{ message.content }}</span>
    </div>
    {% endif %}
{% endfor %}
