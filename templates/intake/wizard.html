{% extends 'consult_base.html' %}
{% load static %}

{% block title %}Talk to a Lawyer | Lex Regis{% endblock %}

{% block content %}
<style>
    .question-card {
        transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        opacity: 1;
        transform: translateY(0);
    }
    .question-card.fade-out {
        opacity: 0;
        transform: translateY(-15px);
    }
    .question-card.fade-in {
        opacity: 0;
        transform: translateY(15px);
    }
    
    .choice-card {
        border: 1px solid var(--lex-border);
        border-radius: var(--lex-radius-md);
        padding: 20px;
        cursor: pointer;
        transition: all 0.2s ease;
        background: var(--lex-white);
        text-align: center;
        font-weight: 500;
        color: var(--lex-text);
        box-shadow: var(--lex-shadow-sm);
    }
    .choice-card:hover {
        border-color: rgba(201, 162, 77, 0.4);
        background: var(--lex-surface-light);
        transform: translateY(-2px);
        box-shadow: var(--lex-shadow-md);
    }
    .choice-card.selected {
        border-color: var(--lex-gold);
        background: rgba(201, 162, 77, 0.05);
        color: var(--lex-navy);
        font-weight: 600;
    }
</style>

<div class="h-100 d-flex flex-column" x-data="intakeEngine()">
    
    <!-- Dynamic Microcopy -->
    <div class="text-center mt-4 mb-2" style="height: 24px;">
        <span class="text-lex-text-muted small fw-bold text-uppercase tracking-wide transition-all" style="letter-spacing: 1px;" x-text="currentMicrocopy"></span>
    </div>

    <!-- Main Conversational Area -->
    <div class="flex-grow-1 d-flex align-items-center justify-content-center p-4">
        <div class="w-100" style="max-width: 700px;">
            
            <!-- Questions Flow -->
            <div x-show="!showReview" class="question-card lex-card p-5" :class="{ 'fade-out': transitioningOut, 'fade-in': transitioningIn }">
                <template x-if="currentQuestion">
                    <div>
                        <h2 class="fw-bold mb-2" style="font-size: 2.5rem;" x-text="currentQuestion.text"></h2>
                        <p class="text-lex-text-muted fs-5 mb-5" x-text="currentQuestion.subtext"></p>
                        
                        <!-- Free Text / Textarea -->
                        <template x-if="currentQuestion.type === 'textarea'">
                            <div>
                                <textarea class="form-control lex-input w-100" 
                                          rows="5" 
                                          style="resize: none; font-size: 1.1rem;" 
                                          x-model="answers[currentQuestion.id]" 
                                          @keydown.shift.enter="return"
                                          @keydown.enter.prevent="next()"
                                          placeholder="Type your answer here... (Shift+Enter for new line)"
                                          x-ref="currentInput"></textarea>
                            </div>
                        </template>

                        <!-- Short Text -->
                        <template x-if="currentQuestion.type === 'text'">
                            <div>
                                <input type="text" class="form-control lex-input w-100" 
                                       style="font-size: 1.25rem; padding: 1rem;"
                                       x-model="answers[currentQuestion.id]"
                                       @keydown.enter.prevent="next()"
                                       x-ref="currentInput"
                                       placeholder="Type here...">
                            </div>
                        </template>
                        
                        <!-- Date -->
                        <template x-if="currentQuestion.type === 'date'">
                            <div>
                                <input type="date" class="form-control lex-input w-100" 
                                       style="font-size: 1.25rem; padding: 1rem;"
                                       x-model="answers[currentQuestion.id]"
                                       @keydown.enter.prevent="next()"
                                       x-ref="currentInput">
                            </div>
                        </template>

                        <!-- Choice Cards -->
                        <template x-if="currentQuestion.type === 'choice'">
                            <div class="row g-3">
                                <template x-for="option in currentQuestion.options" :key="option">
                                    <div class="col-sm-6">
                                        <div class="choice-card h-100" 
                                             :class="{ 'selected': answers[currentQuestion.id] === option }"
                                             @click="answers[currentQuestion.id] = option; if(currentQuestion.autoAdvance) next();">
                                            <span x-text="option"></span>
                                            <i class="fa-solid fa-check ms-2 text-lex-success" x-show="answers[currentQuestion.id] === option"></i>
                                        </div>
                                    </div>
                                </template>
                            </div>
                        </template>
                        
                    </div>
                </template>
            </div>
            
            <!-- Final Review State -->
            <div x-show="showReview" class="question-card" style="display: none;">
                <div class="text-center mb-5">
                    <h2 class="fw-bold mb-2">Review Your Details</h2>
                    <p class="text-lex-text-muted fs-5">Please ensure everything is correct before we analyze your situation.</p>
                </div>
                
                <div class="lex-card p-4 mb-4">
                    <div class="row g-4">
                        <template x-for="q in visibleQuestions" :key="q.id">
                            <div class="col-12 border-bottom pb-3 last:border-0" style="border-color: var(--lex-border) !important;">
                                <div class="d-flex justify-content-between align-items-start">
                                    <div>
                                        <span class="d-block text-lex-text-muted small fw-bold text-uppercase mb-1" x-text="q.text"></span>
                                        <span class="fs-6 text-lex-text" x-text="answers[q.id] || 'Not answered'"></span>
                                    </div>
                                    <button class="btn btn-sm btn-lex-tertiary rounded-circle" @click="editQuestion(q.id)" title="Edit">
                                        <i class="fa-solid fa-pen"></i>
                                    </button>
                                </div>
                            </div>
                        </template>
                    </div>
                </div>
            </div>

            <!-- Navigation Controls -->
            <div class="d-flex justify-content-between align-items-center mt-5">
                <button class="btn btn-lex-tertiary px-3 fw-bold" @click="back()" :style="currentQuestionIndex === 0 && !showReview ? 'visibility: hidden;' : ''">
                    <i class="fa-solid fa-arrow-left me-2"></i> Back
                </button>
                
                <button x-show="!showReview" class="btn btn-lex-primary px-5 py-3 fw-bold shadow-lg fs-5 d-flex align-items-center" 
                        @click="next()" 
                        :disabled="!canContinue">
                    Continue <i class="fa-solid fa-arrow-right ms-3"></i>
                </button>
                
                <form x-show="showReview" method="POST" @submit="submitIntake" style="display: none;">
                    {% csrf_token %}
                    <input type="hidden" name="description" :value="answers['description'] || ''">
                    <input type="hidden" name="category" :value="answers['category'] || ''">
                    <input type="hidden" name="city" :value="answers['city'] || ''">
                    <input type="hidden" name="state" :value="answers['state'] || ''">
                    <input type="hidden" name="incident_date" :value="answers['incident_date'] || ''">
                    <input type="hidden" name="urgency" :value="mapUrgency(answers['urgency'])">
                    <input type="hidden" name="budget" :value="answers['budget'] || ''">
                    <input type="hidden" name="preferred_consultation" :value="answers['preferred_consultation'] || ''">
                    <input type="hidden" name="hearing_scheduled" :value="answers['hearing_scheduled'] === 'Yes' ? 'true' : 'false'">
                    
                    <input type="hidden" name="extra_context" :value="generateExtraContext()">
                    
                    <button type="submit" class="btn btn-lex-primary px-5 py-3 fw-bold shadow-sm fs-5 d-flex align-items-center" :disabled="submitting">
                        <span x-show="!submitting">Analyze My Situation <i class="fa-solid fa-bolt ms-3"></i></span>
                        <span x-show="submitting"><i class="fa-solid fa-circle-notch fa-spin me-2"></i> Processing...</span>
                    </button>
                </form>
            </div>
            
            <div class="text-center mt-4" x-show="!showReview">
                <span class="small text-lex-text-muted fw-bold">Press <kbd class="bg-lex-surface-light border text-lex-text px-2 py-1 rounded">Enter</kbd> to continue</span>
            </div>

        </div>
    </div>
</div>

<script>
    document.addEventListener('alpine:init', () => {
        Alpine.data('intakeEngine', () => ({
            currentQuestionIndex: 0,
            answers: {},
            showReview: false,
            transitioningOut: false,
            transitioningIn: false,
            submitting: false,
            
            microcopies: [
                "Take your time.",
                "You don't need legal terminology.",
                "We'll organize the details for you.",
                "Your information stays secure.",
                "Almost there."
            ],
            
            init() {
                const saved = sessionStorage.getItem('lexIntakeAnswers');
                if (saved) {
                    try { this.answers = JSON.parse(saved); } catch(e) {}
                }
                
                setTimeout(() => { this.focusInput(); }, 100);
            },
            
            get currentMicrocopy() {
                if (this.showReview) return "Final Review";
                return this.microcopies[this.currentQuestionIndex % this.microcopies.length];
            },
            
            get visibleQuestions() {
                let q = [];
                q.push({ id: 'description', text: 'What happened?', subtext: 'Tell us in your own words. You don\'t need to know the legal terminology.', type: 'textarea' });
                q.push({ id: 'category', text: 'What type of issue is this?', type: 'choice', options: ['Property', 'Family', 'Criminal', 'Employment', 'Consumer', 'Corporate', 'I Don\'t Know'] });
                
                const cat = this.answers.category;
                if (cat === 'Employment') {
                    q.push({ id: 'emp_terminated', text: 'Were you terminated?', type: 'choice', options: ['Yes', 'No'] });
                    if (this.answers.emp_terminated === 'Yes') {
                        q.push({ id: 'emp_notice', text: 'Did you receive notice?', type: 'choice', options: ['Yes', 'No'] });
                    }
                    q.push({ id: 'emp_contract', text: 'Do you have an employment contract?', type: 'choice', options: ['Yes', 'No', 'I\'m not sure'] });
                } else if (cat === 'Property') {
                    q.push({ id: 'prop_type', text: 'Is this regarding ownership or rental?', type: 'choice', options: ['Ownership', 'Rental', 'Other'] });
                    q.push({ id: 'prop_notice', text: 'Have you received any legal notice?', type: 'choice', options: ['Yes', 'No'] });
                } else if (cat === 'Family') {
                    q.push({ id: 'fam_type', text: 'What type of family matter is this?', type: 'choice', options: ['Divorce', 'Custody', 'Maintenance', 'Domestic Violence', 'Other'] });
                } else if (cat === 'Criminal') {
                    q.push({ id: 'crim_fir', text: 'Has an FIR been filed?', type: 'choice', options: ['Yes', 'No', 'I\'m not sure'] });
                }
                
                q.push({ id: 'city', text: 'Where are you located?', subtext: 'City name', type: 'text' });
                q.push({ id: 'state', text: 'State', type: 'text' });
                q.push({ id: 'incident_date', text: 'When did this happen?', type: 'date' });
                q.push({ id: 'urgency', text: 'How urgent is it?', type: 'choice', options: ['Exploring', 'This Week', 'Urgent', 'Emergency'] });
                q.push({ id: 'hearing_scheduled', text: 'Do you have any upcoming hearing or deadline?', type: 'choice', options: ['Yes', 'No', 'I\'m not sure'] });
                q.push({ id: 'preferred_consultation', text: 'What consultation mode do you prefer?', type: 'choice', options: ['Video', 'Audio', 'Chat'] });
                q.push({ id: 'budget', text: 'What is your approximate budget?', type: 'choice', options: ['₹500–₹2,000', '₹2,000–₹5,000', '₹5,000–₹10,000', '₹10,000+', 'Flexible'] });
                
                return q;
            },
            
            get currentQuestion() {
                return this.visibleQuestions[this.currentQuestionIndex];
            },
            
            get canContinue() {
                if (!this.currentQuestion) return false;
                const val = this.answers[this.currentQuestion.id];
                if (this.currentQuestion.type === 'textarea' || this.currentQuestion.type === 'text') {
                    return val && val.trim().length > 0;
                }
                return val !== undefined && val !== '';
            },
            
            next() {
                if (!this.canContinue) return;
                
                sessionStorage.setItem('lexIntakeAnswers', JSON.stringify(this.answers));
                
                window.dispatchEvent(new CustomEvent('update-progress', { 
                    detail: { step: this.currentQuestionIndex + 1, total: this.visibleQuestions.length }
                }));

                this.transitioningOut = true;
                this.transitioningIn = false;
                
                setTimeout(() => {
                    if (this.currentQuestionIndex < this.visibleQuestions.length - 1) {
                        this.currentQuestionIndex++;
                    } else {
                        this.showReview = true;
                    }
                    this.transitioningOut = false;
                    this.transitioningIn = true;
                    
                    setTimeout(() => {
                        this.transitioningIn = false;
                        this.focusInput();
                    }, 50);
                }, 300);
            },
            
            back() {
                this.transitioningOut = true;
                setTimeout(() => {
                    if (this.showReview) {
                        this.showReview = false;
                    } else if (this.currentQuestionIndex > 0) {
                        this.currentQuestionIndex--;
                    }
                    this.transitioningOut = false;
                    this.transitioningIn = true;
                    
                    setTimeout(() => {
                        this.transitioningIn = false;
                        this.focusInput();
                    }, 50);
                }, 300);
            },
            
            editQuestion(id) {
                const idx = this.visibleQuestions.findIndex(q => q.id === id);
                if (idx !== -1) {
                    this.showReview = false;
                    this.currentQuestionIndex = idx;
                    setTimeout(() => { this.focusInput(); }, 100);
                }
            },
            
            focusInput() {
                if (this.$refs.currentInput) {
                    this.$refs.currentInput.focus();
                }
            },
            
            submitIntake(e) {
                this.submitting = true;
                sessionStorage.removeItem('lexIntakeAnswers');
            },
            
            mapUrgency(val) {
                if(val === 'Urgent') return 'URGENT';
                if(val === 'Emergency') return 'EMERGENCY';
                return 'ROUTINE';
            },
            
            generateExtraContext() {
                let ctx = "\n--- Additional Context ---\n";
                for(let q of this.visibleQuestions) {
                    if(!['description', 'category', 'city', 'state', 'incident_date', 'urgency', 'budget', 'preferred_consultation'].includes(q.id)) {
                        if(this.answers[q.id]) {
                            ctx += `${q.text}: ${this.answers[q.id]}\n`;
                        }
                    }
                }
                return ctx;
            }
        }));
    });
</script>
{% endblock %}
